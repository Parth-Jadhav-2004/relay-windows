name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish self-contained x64
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          if ($ver -notmatch '^\d+\.\d+\.\d+') { throw "Tag $tag is not vMAJOR.MINOR.PATCH" }
          dotnet publish src/Relay/Relay.csproj -c Release -p:Platform=x64 --self-contained true -p:Version=$ver -p:AssemblyVersion=$ver.0 -p:FileVersion=$ver.0 -p:InformationalVersion=$ver -o publish

      - name: Publish self-contained arm64
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag.TrimStart("v")
          dotnet publish src/Relay/Relay.csproj -c Release -p:Platform=ARM64 -r win-arm64 --self-contained true -p:Version=$ver -p:AssemblyVersion=$ver.0 -p:FileVersion=$ver.0 -p:InformationalVersion=$ver -o publish-arm64

      - name: Zip
        shell: pwsh
        run: |
          Compress-Archive -Path publish\* -DestinationPath Relay-windows-x64.zip
          Compress-Archive -Path publish-arm64\* -DestinationPath Relay-windows-arm64.zip

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            Relay-windows-x64.zip
            Relay-windows-arm64.zip
          body: |
            Self-contained Relay for Windows (x64 and arm64).

            Settings → About turns Check for updates into Download and restart.

            <!-- relay:install -->
            Or unzip `Relay-windows-x64.zip` or `Relay-windows-arm64.zip` into `%LOCALAPPDATA%\Programs\Relay`.
